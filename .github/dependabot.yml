# Dependency and action updates (spec 012, audit A-02). Actions are pinned by commit, and
# Dependabot keeps the pins and their version comments current (A-03).
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      servicenow-sdk:
        patterns: ["@servicenow/*"]
      development:
        dependency-type: development
    ignore:
      # TypeScript stays on 6.x until dependency-cruiser supports 7 (AGENTS.md toolchain note).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
