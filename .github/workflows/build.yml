# Builds the snagentic binary natively on every supported platform and runs it there
# (spec 001, deliverable D5, spikes S3 and S5). Results are published as annotations.
name: build

on:
  push:
    paths:
      - "packages/**"
      - "scripts/**"
      - "tools/spikes/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-15 }
          - { target: windows-x64, runner: windows-latest }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: compile snagentic
        run: bun run build
      - name: "S3: run doctor from the binary and measure start-up"
        run: >
          bun scripts/measure-s3.ts --binary dist/snagentic --target ${{ matrix.target }}
          --out dist/s3-${{ matrix.target }}.json
      - name: "S5: lint one file from a compiled binary"
        if: always()
        run: |
          bun build tools/spikes/s5-lint-latency/lint-once.ts --compile --minify --outfile dist/s5-lint
          bun scripts/measure-s5.ts --binary dist/s5-lint \
            --sample tools/spikes/s5-lint-latency/sample-business-rule.js \
            --target ${{ matrix.target }} --out dist/s5-${{ matrix.target }}.json
      # Spike S13 (ADR-0028): the SDK's build embedded in a binary, run on each platform against
      # the now-sdk CLI's committed output (flows test plan A1, A2, A3, A4, A5).
      - name: "S13: build Fluent fixtures from a binary"
        if: always()
        working-directory: tools/spikes/s13-embedded-sdk
        run: |
          bun install --frozen-lockfile
          bun make-types.ts .
          bun compile.ts ./embed.ts ./embed-bin
          bun compile.ts ./with-sdk-split.ts ./snagentic-sdk-bin ./embed.ts --minify=whitespace,syntax
          bun fixtures.ts --binary ./embed-bin --fixtures ../../../tests/fixtures/fluent \
            --target ${{ matrix.target }} --startup ../../../dist/snagentic,./snagentic-sdk-bin \
            --keep ../../../dist/s13-failed-builds
      - name: "S13: trace the SDK's file reads for s11-flows (A3, Windows investigation)"
        if: always()
        working-directory: tools/spikes/s13-embedded-sdk
        run: |
          cp -r ../../../tests/fixtures/fluent/s11-flows "$RUNNER_TEMP/s11-trace"
          rm -rf "$RUNNER_TEMP/s11-trace/expected"
          S13_TRACE=1 ./embed-bin "$RUNNER_TEMP/s11-trace" | grep -E "^trace|^success" || true
      - name: "S13: the now-sdk CLI (Node) on s11-flows, to compare with the binary (A3)"
        if: always()
        run: |
          cp -r tests/fixtures/fluent/s11-flows "$RUNNER_TEMP/s11-cli"
          rm -rf "$RUNNER_TEMP/s11-cli/expected"
          cd "$RUNNER_TEMP/s11-cli"
          npm install --no-audit --no-fund --ignore-scripts @servicenow/sdk@4.13.6 >/dev/null
          NO_TELEMETRY=1 npx now-sdk build >/dev/null 2>&1 || echo "CLI build failed"
          echo "CLI records: $(find dist/app -name '*.xml' | wc -l)"
          find dist/app -name '*.xml' | sed -E 's|.*/app/||; s|/.*||' | sort | uniq -c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snagentic-${{ matrix.target }}
          path: dist/
          retention-days: 14
