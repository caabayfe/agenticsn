# Temporary diagnostic for the SDK 4.14.0 upgrade (PR #184); never merged.
name: diag-windows-glob
on:
  push:
    branches: [diag/sdk414-windows-glob]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun tools/diag/windows-glob.ts
