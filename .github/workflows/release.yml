# Releases snagentic from a version tag (plan section 8): checks the tag matches the source
# version and the changelog, runs verify, builds the four supported binaries natively, writes
# SHA256SUMS, attests build provenance and publishes a GitHub release.
# Run it by hand (workflow_dispatch) to build everything without publishing.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: tag, source version and changelog agree
        if: startsWith(github.ref, 'refs/tags/')
        run: bun scripts/check-release.ts "${GITHUB_REF_NAME}"
      # As verify.yml: the documentation media tests (ADR-0036) need ffmpeg, and the coverage
      # gate counts them. The same pinned static build and cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/snagentic-ffmpeg
          key: ffmpeg-7.0.2-e7e7fb30
      - name: ffmpeg
        timeout-minutes: 3
        run: scripts/ci/ffmpeg.sh "$HOME/.cache/snagentic-ffmpeg"
      - run: bun run verify

  binary:
    needs: check
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: macos-arm64, runner: macos-15, file: snagentic }
          - { target: windows-x64, runner: windows-latest, file: snagentic.exe }
          - { target: linux-x64, runner: ubuntu-24.04, file: snagentic }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, file: snagentic }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: the binary starts and reports its version
        run: dist/${{ matrix.file }} --version
      - name: name it after its platform
        run: |
          mkdir -p release
          suffix=""; [ "${{ matrix.file }}" = "snagentic.exe" ] && suffix=".exe"
          cp "dist/${{ matrix.file }}" "release/snagentic-${{ matrix.target }}${suffix}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          retention-days: 7

  publish:
    needs: binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: checksums
        working-directory: release
        run: sha256sum snagentic-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/snagentic-*
      - name: release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          cat notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" release/snagentic-* release/SHA256SUMS
          scripts/install/install.sh scripts/install/install.ps1
          --title "snagentic ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
