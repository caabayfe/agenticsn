# Tells us when we can move from TypeScript 6 to 7 (see AGENTS.md, toolchain note).
# Expected to fail until dependency-cruiser can read sources with TypeScript 7.
# When it passes, upgrade the pinned version in package.json.
name: typescript-7-readiness

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: switch to TypeScript 7 (this run only)
        run: bun add -d typescript@^7
      - name: type check with TypeScript 7
        run: bun run typecheck
      - name: architecture rules with TypeScript 7 (fails if 0 modules are analysed)
        run: bun run arch
