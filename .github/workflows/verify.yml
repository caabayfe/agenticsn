name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Documentation media (ADR-0035): ffmpeg encodes audio and video; the runner image has
      # Google Chrome for the video recording test.
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: typecheck, lint, architecture rules, tests with coverage
        run: bun run verify
