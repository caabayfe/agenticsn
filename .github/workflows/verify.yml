name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Documentation media (ADR-0036): ffmpeg encodes audio and video; the runner image has
      # Google Chrome for the video recording test.
      # The Ubuntu mirror is sometimes slow enough to eat the whole job (2026-10-22): each try
      # gets 4 minutes, and a second try follows a stalled one.
      - name: ffmpeg
        timeout-minutes: 9
        run: |
          for try in 1 2; do
            timeout 240 sh -c 'sudo apt-get update -q && sudo apt-get install -y -q ffmpeg' && exit 0
            echo "ffmpeg install try $try stalled or failed"
          done
          exit 1
      - name: typecheck, lint, architecture rules, tests with coverage
        run: bun run verify
