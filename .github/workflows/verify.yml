name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Documentation media (ADR-0036): ffmpeg encodes audio and video; the runner image has
      # Google Chrome for the video recording test. A pinned static build, checked by SHA-256 and
      # cached, not the Ubuntu mirror, which stalled whole jobs (2026-10-22).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/snagentic-ffmpeg
          key: ffmpeg-7.0.2-e7e7fb30
      - name: ffmpeg
        timeout-minutes: 3
        run: scripts/ci/ffmpeg.sh "$HOME/.cache/snagentic-ffmpeg"
      - name: typecheck, lint, architecture rules, tests with coverage
        run: bun run verify
