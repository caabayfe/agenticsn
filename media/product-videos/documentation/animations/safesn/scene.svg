<svg viewBox="0 0 960 440" role="img" aria-labelledby="safesnt safesnd"><title id="safesnt">Safe by design</title><desc id="safesnd">What snagentic will never do</desc><g id="cam"><g class="r g0 box red" id="n-c0"><rect x="40" y="60" width="280" height="120" rx="12"/><text class="lbl b m" x="180.0" y="115.0">Production</text><text class="lbl  m" x="180.0" y="135.0">read-only by construction</text></g><g class="r g1 box grn" id="n-c1"><rect x="340" y="60" width="280" height="120" rx="12"/><text class="lbl b m" x="480.0" y="115.0">Every push</text><text class="lbl  m" x="480.0" y="135.0">gated, and read back</text></g><g class="r g2 box blu" id="n-c2"><rect x="640" y="60" width="280" height="120" rx="12"/><text class="lbl b m" x="780.0" y="115.0">The SDK</text><text class="lbl  m" x="780.0" y="135.0">never holds a credential</text></g><g class="r g3 box blu" id="n-c3"><rect x="40" y="230" width="280" height="120" rx="12"/><text class="lbl b m" x="180.0" y="285.0">The instance</text><text class="lbl  m" x="180.0" y="305.0">light load, paged</text></g><g class="r g4 box amb" id="n-c4"><rect x="340" y="230" width="280" height="120" rx="12"/><text class="lbl b m" x="480.0" y="285.0">Secrets</text><text class="lbl  m" x="480.0" y="305.0">in the OS keychain only</text></g><g class="r g5 box grn" id="n-c5"><rect x="640" y="230" width="280" height="120" rx="12"/><text class="lbl b m" x="780.0" y="285.0">The agent</text><text class="lbl  m" x="780.0" y="305.0">guided, never trusted</text></g></g></svg>
