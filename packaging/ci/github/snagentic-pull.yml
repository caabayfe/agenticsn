# snagentic: the scheduled pull of one instance, published as the team's shared mirror (ADR-0052).
# Guide: https://github.com/caabayfe/agenticsn/blob/main/docs/guides/team-mode.md
#
# Copy this file to .github/workflows/snagentic-pull-dev.yml in the workspace repository, then
# replace the instance name `dev` (and `DEV` in the variable names) with yours. One copy per
# instance. It needs:
#   - secret   SNAGENTIC_DEV_PASSWORD: the puller account's password (or OAuth client secret);
#   - variable SNAGENTIC_DEV_URL: the instance URL, for example dev12345.service-now.com;
#   - optional secret SNAGENTIC_MIRROR_DEPLOY_KEY: a deploy key with write access, the only
#     identity allowed to push servicenow-remote/* (see the guide). Without it, the job pushes
#     with the workflow's own token.
# The kind below must match instances/dev/instance.yaml. Keep the URL and kind here, in the CI
# configuration, never only in the repository (ADR-0020).
#
# This job is the instance's only puller. Keep the shared mirror's max age at least twice the
# schedule below: 30 minutes (the default) for this 15-minute cron, 60 for every 30 minutes. A
# mirror is already a few minutes old when it is published (the pull's run time, the queue,
# GitHub's late start of scheduled runs), so one late run must not make it stale. Past the max
# age, developers' pulls still ask the instance nothing unless they pass --now: `status` calls
# the mirror stale and points at this job. A failing job shows up as a stale mirror, not as one
# puller per developer (ADR-0052, A2). In instances/dev/instance.yaml:
#   shared_mirror:
#     remote: origin
#     max_age_minutes: 30

name: snagentic pull (dev)

on:
  schedule:
    # Every 15 minutes: half the max age above, so developers' own pulls ask the instance
    # nothing even when a run starts late.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Nothing by default; the pull job asks for what it needs.
permissions: {}

# One pull of an instance at a time. A run that starts while another runs waits; it is not
# cancelled halfway through a pull.
concurrency:
  group: snagentic-pull-dev
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Pushes servicenow-remote/dev when no deploy key is set.
      contents: write
    env:
      SNAGENTIC_DEV_PASSWORD: ${{ secrets.SNAGENTIC_DEV_PASSWORD }}
      SNAGENTIC_DEV_URL: ${{ vars.SNAGENTIC_DEV_URL }}
      SNAGENTIC_DEV_KIND: development
    steps:
      # Only the files the pull reads from the working tree: the workspace manifest, the
      # instance's profile and .gitignore. The default branch holds the integrated mirror (GBs on
      # a large instance), and the pull never reads it: it writes the mirror branch with git
      # plumbing. One commit, and no file contents outside these (blobless).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.SNAGENTIC_MIRROR_DEPLOY_KEY }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /snagentic.yaml
            /.gitignore
            /instances/dev/instance.yaml
      # The mirror branch's last commit, with its files: the pull reads them (its state, and the
      # records it compares), and a blobless fetch would download each one in its own request.
      # Unsetting the filter makes the pull's own fetches (a newer tip after a refused publish)
      # take whole commits too. One commit, not the branch's history. Nothing on the first run.
      - name: fetch the mirror branch
        run: |
          git config --unset remote.origin.partialclonefilter
          if git ls-remote --exit-code --heads origin servicenow-remote/dev; then
            git fetch --no-tags --depth 1 origin \
              +refs/heads/servicenow-remote/dev:refs/remotes/origin/servicenow-remote/dev
          fi
      - name: install snagentic
        env:
          # The release this template came with. Raise it on purpose, after reading the changelog.
          SNAGENTIC_VERSION: "2.20.1"
          # Lets the install script check the build provenance (ADR-0043).
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://github.com/caabayfe/agenticsn/releases/download/v${SNAGENTIC_VERSION}/install.sh" -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh" | tee "$RUNNER_TEMP/install.log"
          # Refuse a binary whose provenance was not checked.
          grep -q "provenance verified" "$RUNNER_TEMP/install.log"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The digest of the last catalog this job read from the instance, and nothing else: no
      # credential, no instance data. With it, a run reads the catalog again only when the
      # dictionary changed; without it (first run, evicted cache), each run that writes reads it
      # once (spec 014, SEC2-03). One entry per run; the newest is restored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .snagentic/dev/trust.json
          key: snagentic-trust-dev-${{ github.run_id }}
          restore-keys: snagentic-trust-dev-
      # --now: the designated puller always asks the instance, even when the last scheduled pull
      # is a little younger than the max age.
      - name: pull and publish
        run: snagentic pull dev --now --publish --format text
